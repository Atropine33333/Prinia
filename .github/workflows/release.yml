name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      # 使用与本地开发一致的 debug keystore 签名，保证 CI 包可覆盖安装本地包（应用内更新）
      - name: Install debug keystore (统一签名)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "debug keystore installed"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 未配置，本次构建的签名与本地开发包不一致"
          fi
      - name: Install CMake 3.22.1 (AGP requirement)
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" > /dev/null
      # flutter_displaymode 钉死 compileSdk 33，CI 未装该平台，改用 34
      - name: Patch flutter_displaymode compileSdk
        run: |
          find /home/runner/.pub-cache -path "*flutter_displaymode*/android/build.gradle" | while read -r f; do
            echo "patching $f"
            sed -i 's/compileSdkVersion 33/compileSdkVersion 34/' "$f"
          done
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter pub get
      # 新 MSVC 硬报错废弃的 /await 协程选项，按官方提示注入抑制宏
      - run: flutter build windows --release
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      - shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Prinia-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Prinia-windows.zip
          if-no-files-found: error

  release:
    needs: [ build-android, build-windows ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app-*-release.apk
            Prinia-windows.zip
